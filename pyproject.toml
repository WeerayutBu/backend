[project]
name = "backend-learning"
version = "0.1.0"
description = "Shared environment for backend learning notebooks"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.10,<5",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.121,<1",
    "httpx>=0.28,<1",
    "ipykernel>=6.30,<8",
    "pyjwt>=2.10,<3",
    "redis>=5.2,<7",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"
